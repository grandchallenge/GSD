claim_firewall:
  - "no transition claim from infrastructure-only tests"
  - "no mechanism claim"
  - "capacity allocation remains a hypothesis"
  - "hard accuracy is secondary to soft margin"
  - "no 7B/32B escalation before G1"
stop_conditions:
  - "accelerator execution surface unavailable after implementation/CI is complete"
  - "external artifact cannot be resolved by exact identity"
